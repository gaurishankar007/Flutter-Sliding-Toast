name: flutter_sliding_toast
description: "A flutter package for displaying messages with custom styling and animation behavior."
version: 1.8.0
homepage: https://github.com/gaurishankar007/flutter_sliding_toast
repository: https://github.com/gaurishankar007/flutter_sliding_toast
documentation: https://github.com/gaurishankar007/flutter_sliding_toast
issue_tracker: https://github.com/gaurishankar007/flutter_sliding_toast/issues

screenshots:
  - description: "Stacked toasts with the first one in front and the later ones peeking out behind it."
    path: doc/screenshots/stacked.webp
  - description: "Toasts shown one by one, with a badge counting the ones waiting."
    path: doc/screenshots/one_by_one.webp
  - description: "Sliding toasts with a simple, a glassy, and an image-decorated style."
    path: doc/screenshots/sliding.webp

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^27.0.0
